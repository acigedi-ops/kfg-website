name: DNS check
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/dns-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== www @8.8.8.8"; dig +noall +answer www.kaplunfinancial.com @8.8.8.8
          echo "== www @1.1.1.1"; dig +noall +answer www.kaplunfinancial.com @1.1.1.1
          echo "== apex"; dig +short A kaplunfinancial.com @8.8.8.8
          echo "== CAA"; dig +short CAA kaplunfinancial.com @8.8.8.8
          for h in kaplunfinancial.com www.kaplunfinancial.com; do
            echo "== cert $h"; echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          done
          echo "== http www"; curl -sI http://www.kaplunfinancial.com | head -4
          echo "== https www -k"; curl -skI https://www.kaplunfinancial.com | head -4
