name: DNS check

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/dns-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in / /favicon.ico /kfg-icon.svg /favicon.svg /img/apple-touch-icon.png /img/favicon-32.png; do
            echo "== https://kaplunfinancial.com$u"; curl -sS -o /tmp/f -w "%{http_code} %{content_type} %{size_download}\n" "https://kaplunfinancial.com$u"
          done
          curl -sS https://kaplunfinancial.com/ | grep -o '<link rel="[a-z-]*icon[^>]*>'
          curl -sS https://www.kaplunfinancial.com/ -o /dev/null -w "www %{http_code} %{redirect_url}\n"
