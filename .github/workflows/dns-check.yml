name: DNS check
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/dns-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in /favicon.ico /kfg-icon.svg /favicon.svg /img/favicon-32.png; do
            echo "== $u"; curl -sS -o /dev/null -w "%{http_code} %{content_type}\n" "https://kaplunfinancial.com$u"
          done
          curl -sS https://kaplunfinancial.com/ | grep -o '<link rel="icon[^>]*>'
